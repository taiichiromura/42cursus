server {
	listen 8083;
	server_name default_server;
	root ./public/;
	error_page 500 /errorPages/server_error_page.html;
	error_page 404 /errorPages/404.html;
	error_page 403 /errorPages/403.html;

	# sample_command: curl -i localhost:8083
	location / {
		allow_methods GET POST DELETE;
		index index.html;
		autoindex off;
	}
	location /autoindex_dir/ {
		root ./public/autoindex_dir/;
		autoindex on;
	}
	# sample_command: curl -i -X POST --data "HELLO" localhost:8083/upload/test2.txt
	location /upload/ {
		method GET POST DELETE;
		root ./public/upload/;
		autoindex off;
		max_body_size 1000000;
	}
	location /post_body/ {
		method POST;
		max_body_size 100;
	}

	# sample_command: curl -i localhost:8080/index/
	location /index/ {
		autoindex on;
	}
	# sample_command: curl -i localhost:8080/cgi/cgi.sh
	location /cgi/ {
		method GET POST;
		root ./public/cgi-files/;
		index cgi.sh;
		cgi_path .sh /bin/bash;
		cgi_path .py /usr/bin/python3;
	}


	# sample_command: curl -v localhost:8080/delete/upload_file.txt -X DELETE
	location /delete/ {
		root ./public/upload/;
		method DELETE;
	}
	# sample_command: curl -i localhost:8080/redirect/
	location /redirect/ {
		return 301 https://42tokyo.jp;
	}
}

server {
	listen 8081 ;
	server_name default_server;
	root ./public/www/;
	# sample_command: curl --resolve default_server:8081:0.0.0.0 http://default_server:8081
	location / {
		index default.html;
	}
}

server {
	listen 8081 ;
	server_name virtual_server;
	root ./public/www/;
	# sample_command: curl --resolve virtual_server:8081:0.0.0.0 http://virtual_server:8081
	location / {
		index virtual.html;
	}
}
